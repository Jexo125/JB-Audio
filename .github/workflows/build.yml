name: Build & Release JB Audio

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.0'
  JAVA_VERSION: '17'

jobs:
  # Job 1: Extract version and check if we should create a release
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Detected version in pubspec: $VERSION"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="v${{ steps.get_version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG already exists. No new release needed."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "🚀 New version detected ($TAG). Will create a release."
          fi

  # Job 2: Android Build
  build-android:
    runs-on: ubuntu-latest
    needs: metadata
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/jbaudio-release.keystore
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=jbaudio-release.keystore
          EOF
      
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64
      
      - name: Rename APK
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/JB-Audio-v$VERSION.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  # Job 3: Create GitHub Release (only if version changed)
  release:
    runs-on: ubuntu-latest
    needs: [metadata, build-android]
    if: needs.metadata.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Create Tag and Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.metadata.outputs.version }}
          name: JB Audio v${{ needs.metadata.outputs.version }}
          body: |
            ## 🎧 JB Audio v${{ needs.metadata.outputs.version }}

            Nouvelle version officielle de JB Audio pour Android.

            ### 📦 Téléchargements

            - `JB-Audio-v${{ needs.metadata.outputs.version }}.apk`

            ---
            *Généré automatiquement par GitHub Actions.*
          files: |
            artifacts/android/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
